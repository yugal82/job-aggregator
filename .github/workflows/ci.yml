name: ci

on:
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "server/**"
      - ".github/workflows/ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jobs
          POSTGRES_PASSWORD: jobs
          POSTGRES_DB: jobs
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobs -d jobs"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ENV: ci
      LOG_LEVEL: INFO
      DATABASE_URL: postgresql+asyncpg://jobs:jobs@localhost:5432/jobs
      TEST_DATABASE_URL: postgresql+asyncpg://jobs:jobs@localhost:5432/jobs_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run pytest
        run: pytest --tb=short
