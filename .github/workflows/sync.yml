name: sync-jobs

# Scheduled sync — replaces the always-on APScheduler worker. Runs every
# 6 hours (00:00 / 06:00 / 12:00 / 18:00 UTC).
#
# Fans out one job per company: a sequential `sync --company all` from a
# runner pays a Neon round-trip per job and outgrew the timeout after ~4
# companies. Parallel jobs are safe — the advisory lock is per company.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:   # manual trigger button in the Actions tab

concurrency:
  group: sync-jobs
  cancel-in-progress: false   # don't preempt a running sync; just skip the new one

jobs:
  companies:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.list.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - id: list
        name: List companies with an enabled source
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, yaml
          cfg = yaml.safe_load(open("server/config/companies.yaml"))
          slugs = [
              c["slug"] for c in cfg["companies"]
              if any(s.get("enabled", True) for s in c.get("sources", []))
          ]
          print("slugs=" + json.dumps(slugs))
          EOF

  sync:
    needs: companies
    runs-on: ubuntu-latest
    # NVIDIA (~2000 Workday postings) takes ~35 min; jobs only persist on the
    # final commit, so leave generous headroom. Free on a public repo.
    timeout-minutes: 90
    strategy:
      fail-fast: false        # one broken career site shouldn't cancel the rest
      max-parallel: 10        # keep Neon connection count modest
      matrix:
        company: ${{ fromJSON(needs.companies.outputs.slugs) }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .

      - name: Sync ${{ matrix.company }}
        env:
          # Direct URL — avoids pooler for long-running DDL-ish writes.
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          LOG_LEVEL: INFO
        run: python -m app.cli sync --company ${{ matrix.company }}
